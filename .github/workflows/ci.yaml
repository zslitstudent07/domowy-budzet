
name: FinaSee CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Testy automatyczne
        run: python -m pytest -v

      - name: Kontrola składni
        run: python -m compileall -q app.py tests

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Budowanie obrazu
        run: docker build -t finasee:ci .
